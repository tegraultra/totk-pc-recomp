name: Release folder

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.12
            3.14

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          location: C:\
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-libvpx
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-vulkan-devel
            mingw-w64-ucrt-x86_64-vulkan-memory-allocator
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-spirv-tools
            base-devel
            git
            unzip

      - name: Python environments
        shell: pwsh
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/Scripts/python.exe -r tools/requirements.txt
          uv venv --python 3.14 .venv-py314
          uv pip install --python .venv-py314/Scripts/python.exe -r tools/requirements-py314.txt
          "C:\Program Files (x86)\Microsoft Visual Studio\Installer" | Out-File -Append -Encoding ascii $env:GITHUB_PATH

      - name: Shader translator
        shell: pwsh
        run: .venv\Scripts\python tools\build_xlate.py

      - name: Layout without game files
        shell: pwsh
        run: |
          .venv\Scripts\python -c "import sys; sys.path.insert(0, 'recomp'); import layout; from pathlib import Path; mods = [(n, layout.FIRST_BASE + i * 0x10000000, 0x1000000) for i, n in enumerate(layout.ORDER)]; layout.write(mods, Path('generated/v143'))"

      - name: Release folder
        shell: pwsh
        run: .venv-py314\Scripts\python tools\make_release.py --out build\release\TotK-Setup --zip build\release\TotK-Setup.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TotK-Setup
          path: build/release/TotK-Setup.zip
